name: Weekly AI insight digest

on:
  schedule:
    # Every Monday at 09:00 UTC. GitHub Actions cron always runs in UTC --
    # adjust the hour if you want this to land at a specific local time.
    # Note: GitHub disables scheduled workflows automatically on repos
    # with no activity for 60 days -- push any commit to re-enable it.
    - cron: '0 9 * * 1'
  workflow_dispatch: {}   # adds a "Run workflow" button in the Actions tab for manual/on-demand runs

permissions:
  contents: write   # needed to commit new posts + updated seen.json back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Hard safety net: the pipeline itself is bounded by MAX_ITEMS_PER_RUN
    # and should finish in well under this, but if anything ever gets
    # stuck (network stall, auth prompt, etc.) this kills the job instead
    # of silently burning your free Actions minutes for hours.
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run_pipeline.py

      - name: Commit and push any new posts / updated state
        env:
          # Forces git to fail immediately instead of hanging on an
          # interactive credential prompt with no terminal to answer it --
          # this is necessary to prevent the workflow from hanging indefinitely.
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git config user.name "ai-insight-agent"
          git config user.email "actions@users.noreply.github.com"
          git add _posts/ data/state/seen.json
          git diff --staged --quiet || git commit -m "Automated insight digest run: $(date -u +'%Y-%m-%d')"
          git push
